name: Gitleaks
on:
  workflow_call:
    inputs:
      full_history:
        type: boolean
        default: false
      use_blacksmith:
        description: Use the organization's approved Blacksmith Ubuntu runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  scan:
    name: gitleaks
    runs-on: ${{ inputs.use_blacksmith && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Fetch Git history without checking out files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 2
          git init --quiet .
          git remote add origin "$SERVER_URL/$REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          export GIT_CONFIG_KEY_1=fetch.recurseSubmodules
          export GIT_CONFIG_VALUE_1=false
          git -c credential.helper= fetch --quiet origin \
            '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git -c credential.helper= fetch --quiet origin "$HEAD_SHA"
          git update-ref refs/security/scan-head "$HEAD_SHA"
      - name: Install pinned scanner
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --status
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan with central credential rules
        id: scan
        shell: bash
        env:
          FULL_HISTORY: ${{ inputs.full_history }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/60x-gitleaks.toml"
          cat > "$config" <<'TOML'
          title = "60x credential detection"
          [extend]
          useDefault = true
          [[rules]]
          id = "generic-api-key"
          # Reviewed public route, not an authentication value. Other findings
          # in this file (including on the same line) still use the default rule.
          [[rules.allowlists]]
          description = "Exact native Asymmetrix public companies route"
          condition = "AND"
          paths = ['''^jobs/post-processing-rs/src/tools/asymmetrix\.rs$''']
          regexTarget = "match"
          regexes = ['''^api:(?:GYQcK4au)/v1/companies"$''']
          [[rules.allowlists]]
          description = "Exact reviewed native source-file SHA256 provenance"
          condition = "AND"
          paths = ['''^jobs/post-processing-rs/src/tools/catalog\.json$''']
          regexTarget = "match"
          regexes = [
            '''^anyapi_linkedin\.py": "178de59df4252f5952f9552d1bab870ffea4c4f74d13a222e8a2a1e3cff9974c"$''',
            '''^capiq\.py": "d7f3adaa40c4c22233dade2dd80bc569759e9ff8b6158e42b7b5f2a920ae39d5"$''',
            '''^capiq\.py": "9403c6cb149085a32292b98fd76a97d9378fa918de0136fc82880f85599e5dca"$''',
          ]
          [[rules]]
          id = "60x-api-key"
          description = "AI Brain API key generated by invitations.generate_api_key"
          regex = '''\bsk_live_[A-Za-z0-9_-]{43}'''
          keywords = ["sk_live_"]
          [[rules]]
          id = "gcp-service-account-private-key"
          description = "Private key field in GCP service-account JSON"
          regex = '''(?i)"private_key"\s*:\s*"(-----BEGIN (?:RSA )?PRIVATE KEY-----[^"\r\n]+)'''
          secretGroup = 1
          keywords = ["private_key"]
          [[rules]]
          id = "60x-oauth-refresh-token"
          description = "AI Brain MCP OAuth refresh token, 48 URL-safe random bytes"
          regex = '''(?i)(?:mcp_refresh_token|refresh_token)["']?\s*[:=]\s*["']([A-Za-z0-9_-]{64})["']'''
          secretGroup = 1
          keywords = ["refresh_token"]
          [[rules]]
          id = "60x-oauth-client-secret"
          description = "MCP client secret and agent-mail browser or access token, 32 random bytes"
          regex = '''(?i)(?:mcp_client_secret|client_secret|browser_token|agent_mail_token)["']?\s*[:=]\s*["']([A-Za-z0-9_-]{43})["']'''
          secretGroup = 1
          keywords = ["client_secret", "browser_token", "agent_mail_token"]
          TOML
          # This historical value is only a Terraform random_password keeper,
          # not its generated password. Gitleaks line targets can retain one preceding
          # newline; keep the assignment exact and the exception caller-bound.
          if [[ "${REPOSITORY:-}" == '60xAI/ai-brain-workspace' ]]; then
            cat >> "$config" <<'TOML'
          [[rules]]
          id = "generic-api-key"
          [[rules.allowlists]]
          description = "Known non-secret Dagster rotation keeper in the workspace helper"
          condition = "AND"
          regexTarget = "line"
          paths = ['''^scripts/tavily-prod-terraform\.sh$''']
          regexes = ['''^\n?export TF_VAR_dagster_app_password_rotation[=]2026-09-01-dagster-v1$''']
          TOML
          fi
          # Two historical pipelines findings, bound to the exact commit and path that
          # added them, so the same path or value in any other commit still fails.
          # The sign-in webhook was reviewed and kept by its owner (ai-brain-platform#1601).
          # The tracing-guard value is a fake test key in a since-removed test.
          if [[ "${REPOSITORY:-}" == '60xAI/ai-brain-pipelines' ]]; then
            cat >> "$config" <<'TOML'
          [[allowlists]]
          description = "Reviewed sign-in webhook added by the pipelines seed commit"
          condition = "AND"
          targetRules = ["slack-webhook-url"]
          commits = ["874c2f2814df6febaa0f3e2ac656cef02a84cfe8"]
          paths = ['''^backend/app/api/routes/auth\.py$''']
          [[allowlists]]
          description = "Fake LangSmith key in the removed tracing-guard test"
          condition = "AND"
          targetRules = ["generic-api-key"]
          # The test commit, then the two merges that carried it into development.
          commits = [
            "93e97b5ed28e929ea9a070be57baaa3bd78bb155",
            "db676a8a993e97f42634b12d359f649052dbc544",
            "6b7dcbf2ee692e8877339b8e588c064e08b863f6",
          ]
          paths = ['''^backend/tests/test_tracing_guard\.py$''']
          TOML
          fi
          # The same reviewed sign-in webhook in platform history, bound to the exact
          # commits that added or carried it, so any new commit on the path still fails.
          if [[ "${REPOSITORY:-}" == '60xAI/ai-brain-platform' ]]; then
            cat >> "$config" <<'TOML'
          [[allowlists]]
          description = "Reviewed sign-in webhook kept by its owner (ai-brain-platform#1601)"
          condition = "AND"
          targetRules = ["slack-webhook-url"]
          commits = [
            "3757fbb3bfabef696925b9ee9400e1244fbb202f",
            "43c569cf72e695d023c58593d3e7003a1e9bb5a9",
            "9799135ec5da6b000ebbadb135052b255fd768fa",
            "b83bddef41260358273cad325809e11801d2977c",
            "dd8da03b435323738d8b2d93f77d108b3613af6b",
          ]
          paths = ['''^backend/app/api/routes/auth\.py$''']
          # Reviewed fixtures, placeholders, a public OAuth client ID, a Secret Manager
          # name and file hashes, each bound to the commits that added or carried it.
          [[allowlists]]
          description = "Lead-scoring golden-set fixture identifier"
          condition = "AND"
          targetRules = ["generic-api-key"]
          commits = [
            "033d70998725362cc0491cabd97e9c8808113eab",
            "07eb092b048f7d3ba6b12acfca617fc9914c0dd2",
            "61e25aa06b363ea4b17cb3d6b116d4a5a88012e0",
          ]
          paths = ['''^backend/app/services/lead_scoring/golden_set/scores\.py$''']
          [[allowlists]]
          description = "OAuth client ID and Secret Manager secret name in Cloud Build config"
          condition = "AND"
          targetRules = ["60x-oauth-client-secret", "generic-api-key"]
          commits = [
            "11d92799168c510dad80985a28842c3f18de0322",
            "2c0c8746cf3c478e63fb0ff8126ad4413ea0a4bd",
            "83437d6bb6618aff40d7d647dead07bfa4726c35",
            "eb9330ed1ba90a21b6558fc0bf52f9f6cf5fb294",
          ]
          paths = ['''^backend/cloudbuild\.yaml$''']
          [[allowlists]]
          description = "Fake credential in a connector storage-error test"
          condition = "AND"
          targetRules = ["generic-api-key"]
          commits = [
            "65f4034c9fa540433a149711ae8391cb0ea9e749",
            "ad5ef0c15aa1769d79b56b988e195060393cfb69",
          ]
          paths = ['''^backend/tests/api/test_connectors_credential_storage_errors\.py$''']
          [[allowlists]]
          description = "Fake tokens in MCP OAuth tests"
          condition = "AND"
          targetRules = ["generic-api-key"]
          commits = [
            "50bef15aff7477e0ff9d1509f5182a564b91a264",
            "8abae33d7d3bf1d6c934927da926390baa4a9e95",
            "cc583a4a32ce95d8b0aab924655e532181a0ab3e",
          ]
          paths = ['''^backend/tests/api/test_mcp_oauth\.py$''']
          [[allowlists]]
          description = "Fake key in a source-directory guard test"
          condition = "AND"
          targetRules = ["generic-api-key"]
          commits = [
            "cda49288259943431f3300f4828ad3597a4f4a94",
          ]
          paths = ['''^backend/tests/api/test_source_directory_guards_postgres\.py$''']
          [[allowlists]]
          description = "Fake key and private-key fixtures in an Airbyte log-redaction test"
          condition = "AND"
          targetRules = ["gcp-service-account-private-key", "generic-api-key", "private-key"]
          commits = [
            "5c54feaaa163782cfae10a6f01cf06d1a5b90d6d",
            "8ad9d2b83233cbf09391e5d3091736b3ebb9e320",
            "980d603ddae3faddbe64f662ca97693739c9ee6a",
            "d3ac27f12414439eb0e736ff2f73cfc35609b214",
          ]
          paths = ['''^backend/tests/services/test_airbyte_error_logging\.py$''']
          [[allowlists]]
          description = "Fake private-key fixture in an error-sanitizer test"
          condition = "AND"
          targetRules = ["private-key"]
          commits = [
            "77e218a0bc26604dcb89bef67574718fb4345cc8",
          ]
          paths = ['''^backend/tests/services/test_enrichment_error_sanitizer\.py$''']
          [[allowlists]]
          description = "Fake Slack config values in a connector test"
          condition = "AND"
          targetRules = ["generic-api-key"]
          commits = [
            "0f9c6655a457c3af0650d97b6b320d14cd93226f",
            "492f9a21207d52d434c798aba589ee6a7f61498c",
            "a91f90e815dba18f1104a94ff02cd4d0339bd46c",
            "b63e84d933c6ce5c3cdba5afe3d6c36d7520c884",
          ]
          paths = ['''^backend/tests/services/test_slack_connector_config\.py$''']
          [[allowlists]]
          description = "Fake tokens in an access-log redaction test"
          condition = "AND"
          targetRules = ["generic-api-key"]
          commits = [
            "0b6d9ead7fdda180ccf8c9e4a24805fb6f67562c",
            "60eb8264af7ab798227538539c8838aba6e5e5fe",
            "815c198765629c457f8beba791a41bd296af1302",
            "8299e38c002522cbd337e3c216cdc449b2279758",
            "a3c159f8c5143a4a4db0f27129233b5506b853e0",
          ]
          paths = ['''^backend/tests/test_uvicorn_access_log\.py$''']
          [[allowlists]]
          description = "Placeholder auth header in entity-retriever docs"
          condition = "AND"
          targetRules = ["curl-auth-header"]
          commits = [
            "14b98c3326beb2dc93dc16a842cd955de43672e9",
            "25d5d384ba114c774bf89366252c24d7858309f7",
            "7f623fc03a6a71b42ab3a982b84a633edc7bfa7d",
          ]
          paths = ['''^docs/entity-retriever-external-integration\.md$''', '''^docs/entity-retriever-quick-start\.md$''']
          [[allowlists]]
          description = "Fake token in an auth analytics test"
          condition = "AND"
          targetRules = ["generic-api-key"]
          commits = [
            "50bb14631d4ec00636ea4adc3a5bbdb75cc974f2",
            "6d4eec44b51e32d426f435d5b37ce59fd2c4648a",
            "d00bd24cd1adb7d190b99f98ae8cbc6e2b19e3b1",
          ]
          paths = ['''^frontend/lib/auth-analytics\.test\.ts$''']
          [[allowlists]]
          description = "Fake token in an auth URL contract test"
          condition = "AND"
          targetRules = ["generic-api-key"]
          commits = [
            "0bdbd51dda1ec238494e5e9503d05a9984218432",
            "12f5b4c81d6f8f7cff2c98912d71a10a4c8a47da",
            "7dcb84cbbe132155b9dbe8c3cbe310e28b82ace6",
          ]
          paths = ['''^frontend/lib/auth-url-contracts\.test\.ts$''']
          [[allowlists]]
          description = "SHA-256 file hashes in the Rust MCP SQL manifest"
          condition = "AND"
          targetRules = ["generic-api-key"]
          commits = [
            "fae366492660e48d8bee0b041dd842107a4e2e32",
          ]
          paths = ['''^mcp-server-rs/sql/personal/manifest\.json$''']
          TOML
          fi
          log_opts='--all --diff-merges=first-parent'
          if [[ "$FULL_HISTORY" != true ]]; then
            [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ && "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Missing valid scan range'; exit 2; }
            log_opts="$BASE_SHA..$HEAD_SHA --diff-merges=first-parent"
          fi
          mkdir -p "$RUNNER_TEMP/empty-gitleaks-ignore"
          raw="$RUNNER_TEMP/gitleaks-redacted.json"
          trap 'rm -f "$raw"' EXIT
          set +e
          gitleaks git . --config "$config" --log-opts="$log_opts" \
            --gitleaks-ignore-path "$RUNNER_TEMP/empty-gitleaks-ignore" \
            --ignore-gitleaks-allow --redact=100 --no-banner --no-color \
            --exit-code 10 --timeout 900 --report-format json --report-path "$raw" >/dev/null 2>&1
          result=$?
          set -e
          if [[ "$result" != 0 && "$result" != 10 ]]; then
            echo 'Scanner error. No raw scanner output is published.'
            exit 2
          fi
          python3 - "$raw" <<'PY'
          import json, os, pathlib, sys
          findings = json.loads(pathlib.Path(sys.argv[1]).read_text())
          safe = sorted({(x["File"], x["RuleID"]) for x in findings})
          report = [{"path": p, "rule_id": r} for p, r in safe]
          pathlib.Path(os.environ["RUNNER_TEMP"], "gitleaks-findings.json").write_text(json.dumps(report, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"Gitleaks found {len(report)} unique path/rule pairs. The artifact contains paths and rule IDs only.\n")
          PY
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - name: Save paths and rule IDs only
        if: always() && steps.scan.outputs.result != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitleaks-findings
          path: ${{ runner.temp }}/gitleaks-findings.json
          retention-days: 14
          if-no-files-found: error
      - name: Enforce scan result
        if: steps.scan.outputs.result != '0'
        shell: bash
        run: |
          echo 'Gitleaks blocked this change. Review the path/rule report; route real credentials to F05 rotation.'
          exit 1
