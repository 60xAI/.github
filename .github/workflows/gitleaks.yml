name: Gitleaks
on:
  workflow_call:
    inputs:
      full_history:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch Git history without checking out files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 2
          git init --quiet .
          git remote add origin "$SERVER_URL/$REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          export GIT_CONFIG_KEY_1=fetch.recurseSubmodules
          export GIT_CONFIG_VALUE_1=false
          git -c credential.helper= fetch --quiet origin \
            '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git -c credential.helper= fetch --quiet origin "$HEAD_SHA"
          git update-ref refs/security/scan-head "$HEAD_SHA"
      - name: Install pinned scanner
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --status
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan with central credential rules
        id: scan
        shell: bash
        env:
          FULL_HISTORY: ${{ inputs.full_history }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/60x-gitleaks.toml"
          cat > "$config" <<'TOML'
          title = "60x credential detection"
          [extend]
          useDefault = true
          [[rules]]
          id = "60x-api-key"
          description = "AI Brain API key generated by invitations.generate_api_key"
          regex = '''\bsk_live_[A-Za-z0-9_-]{43}\b'''
          keywords = ["sk_live_"]
          [[rules]]
          id = "gcp-service-account-private-key"
          description = "Private key field in GCP service-account JSON"
          regex = '''(?i)"private_key"\s*:\s*"(-----BEGIN (?:RSA )?PRIVATE KEY-----[^"\r\n]+)'''
          secretGroup = 1
          keywords = ["private_key"]
          [[rules]]
          id = "60x-oauth-refresh-token"
          description = "AI Brain MCP OAuth refresh token, 48 URL-safe random bytes"
          regex = '''(?i)(?:mcp_refresh_token|refresh_token)["']?\s*[:=]\s*["']([A-Za-z0-9_-]{64})["']'''
          secretGroup = 1
          keywords = ["refresh_token"]
          [[rules]]
          id = "60x-oauth-client-secret"
          description = "MCP client secret and agent-mail browser or access token, 32 random bytes"
          regex = '''(?i)(?:mcp_client_secret|client_secret|browser_token|agent_mail_token)["']?\s*[:=]\s*["']([A-Za-z0-9_-]{43})["']'''
          secretGroup = 1
          keywords = ["client_secret", "browser_token", "agent_mail_token"]
          TOML
          log_opts='--all'
          if [[ "$FULL_HISTORY" != true ]]; then
            [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ && "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Missing valid scan range'; exit 2; }
            log_opts="$BASE_SHA..$HEAD_SHA"
          fi
          mkdir -p "$RUNNER_TEMP/empty-gitleaks-ignore"
          raw="$RUNNER_TEMP/gitleaks-redacted.json"
          trap 'rm -f "$raw"' EXIT
          set +e
          gitleaks git . --config "$config" --log-opts="$log_opts" \
            --gitleaks-ignore-path "$RUNNER_TEMP/empty-gitleaks-ignore" \
            --ignore-gitleaks-allow --redact=100 --no-banner --no-color \
            --exit-code 10 --timeout 900 --report-format json --report-path "$raw" >/dev/null 2>&1
          result=$?
          set -e
          if [[ "$result" != 0 && "$result" != 10 ]]; then
            echo 'Scanner error. No raw scanner output is published.'
            exit 2
          fi
          python3 - "$raw" <<'PY'
          import json, os, pathlib, sys
          findings = json.loads(pathlib.Path(sys.argv[1]).read_text())
          safe = sorted({(x["File"], x["RuleID"]) for x in findings})
          report = [{"path": p, "rule_id": r} for p, r in safe]
          pathlib.Path(os.environ["RUNNER_TEMP"], "gitleaks-findings.json").write_text(json.dumps(report, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"Gitleaks found {len(report)} unique path/rule pairs. The artifact contains paths and rule IDs only.\n")
          PY
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - name: Save paths and rule IDs only
        if: always() && steps.scan.outputs.result != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitleaks-findings
          path: ${{ runner.temp }}/gitleaks-findings.json
          retention-days: 30
          if-no-files-found: error
      - name: Enforce scan result
        if: steps.scan.outputs.result != '0'
        shell: bash
        run: |
          echo 'Gitleaks blocked this change. Review the path/rule report; route real credentials to F05 rotation.'
          exit 1
