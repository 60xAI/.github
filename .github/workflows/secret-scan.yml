name: Secret scanning
on:
  pull_request:
  merge_group:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    uses: ./.github/workflows/gitleaks.yml
    with:
      full_history: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
